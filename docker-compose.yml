services:

  mysql:
    image: mysql:8.0
    container_name: renova-mysql

    environment:
      MYSQL_DATABASE: renovation_db
      MYSQL_ROOT_PASSWORD: Admin@123

    ports:
      - "3307:3306"

    volumes:
      - renova_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pAdmin@123"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: renova-backend

    environment:
      DB_URL: jdbc:mysql://mysql:3306/renovation_db
      DB_USERNAME: root
      DB_PASSWORD: Admin@123

      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin@123
      ADMIN_EMAIL: admin@renova.com
      ADMIN_FULL_NAME: Karma Choezom

      JWT_SECRET: renovation-project-secret-key-must-be-at-least-32-characters-long
      JWT_EXPIRATION: 86400000

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: renova-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  renova_mysql_data: